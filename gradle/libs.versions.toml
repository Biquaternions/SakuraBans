
[versions]
checkstyle = "14.4.0"
lombok = "1.18.48"

jspecify = "1.0.1"
jooq = "3.21.10"
hikari = "7.1.0"
h2 = "2.5.252"
mariadb = "4.0.0"
mysql = "26.10.0"
postgresql = "42.7.14"
# Only read by importers (S38): LibertyBans' and AdvancedBan's default storage.
hsqldb = "2.7.4"
caffeine = "3.3.1"
# Shaded and relocated on every platform (plan 3.3, 3.4), never the server's copy.
guava = "33.8.0-jre"
configurate = "4.2.0"
# Shaded and relocated on every platform like Guava: Paper and Velocity ship their own copy.
gson = "2.15.0"
cloud-core = "2.1.0"
cloud-minecraft = "2.0.1"
luckperms = "5.5"

paper = "26.3.build.+"
velocity = "4.3.1"
# Velocity only, compile-only: dialogs where the proxy has the packetevents plugin (S61).
packetevents = "2.14.0"
adventure = "5.2.0"
slf4j = "2.0.17"

junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.24.0"
testcontainers = "2.0.5"

plugin-lombok = "9.8.3"
plugin-shadow = "9.6.1"
plugin-run-task = "3.1.0"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hsqldb = { module = "org.hsqldb:hsqldb", version.ref = "hsqldb" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud-core" }
cloud-minecraft-extras = { module = "org.incendo:cloud-minecraft-extras", version.ref = "cloud-minecraft" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-minecraft" }
cloud-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-minecraft" }
cloud-brigadier = { module = "org.incendo:cloud-brigadier", version.ref = "cloud-minecraft" }
brigadier = { module = "com.mojang:brigadier", version = "1.3.11" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
packetevents-api = { module = "com.github.retrooper:packetevents-api", version.ref = "packetevents" }
adventure-bom = { module = "net.kyori:adventure-bom", version.ref = "adventure" }
adventure-api = { module = "net.kyori:adventure-api" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain" }
adventure-text-logger-slf4j = { module = "net.kyori:adventure-text-logger-slf4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

# Gradle plugins as libraries, so build-logic can put them on its classpath.
plugin-lombok = { module = "io.freefair.lombok:io.freefair.lombok.gradle.plugin", version.ref = "plugin-lombok" }
plugin-shadow = { module = "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin", version.ref = "plugin-shadow" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "plugin-run-task" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "plugin-run-task" }
