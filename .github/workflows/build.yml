name: Build

on:
  push:
    # Every branch except dev/*; version tags still build their release.
    branches-ignore:
      - 'dev/**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release channel
        id: release
        # A tag v1.0.0-alpha.3 builds alpha 3 and v1.0.0 the release; everything else is a
        # dev build numbered by the workflow run.
        run: |
          channel=dev
          number="$GITHUB_RUN_NUMBER"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+(\.[0-9]+)*-(alpha|beta|rc)\.([0-9]+)$ ]]; then
            channel="${BASH_REMATCH[2]}"
            number="${BASH_REMATCH[3]}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+(\.[0-9]+)*$ ]]; then
            channel=release
            number=
          fi
          echo "args=-Pchannel=$channel${number:+ -PbuildNumber=$number}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -x integrationTest ${{ steps.release.outputs.args }}

      - name: Upload the Paper jar
        uses: actions/upload-artifact@v4
        with:
          name: SakuraBans-paper
          # Not the thin jar (the module's own classes only).
          path: |
            platforms/paper/build/libs/SakuraBans-Paper-*.jar
            !platforms/paper/build/libs/*-thin.jar
          if-no-files-found: error

      - name: Upload the Velocity jar
        uses: actions/upload-artifact@v4
        with:
          name: SakuraBans-velocity
          path: |
            platforms/velocity/build/libs/SakuraBans-Velocity-*.jar
            !platforms/velocity/build/libs/*-thin.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  integration-test:
    name: Integration tests (MariaDB, MySQL, PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  web-image:
    name: Web editor image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          # master -> :master and :sha-<commit>; v1.2.3 -> :1.2.3, :1.2 and :latest;
          # v1.0.0-alpha.3 -> :1.0.0-alpha.3 only.
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Published from master and version tags only; other branches and pull requests just
      # build the image.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          # The image reads ../protocol, so the context is the whole repository.
          context: .
          file: web/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
