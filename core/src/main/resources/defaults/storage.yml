# SakuraBans storage.
#
# Changes here need a restart; /sb reload keeps the current storage and says so. SakuraBans
# never rewrites this file.
#
# Every key here can also come from the environment, which wins over this file: the variable is
# SAKURABANS_STORAGE_ and the key in upper case with . and - as _ (SAKURABANS_STORAGE_HOST,
# SAKURABANS_STORAGE_POOL_MAXIMUM_SIZE, SAKURABANS_STORAGE_ADDRESS_HASH_KEY), or one JSON object
# in SAKURABANS_CONFIG ({"storage.password": "..."}; the single variables win over it). Useful
# for containers and for keeping the password and the address hash key out of the file. A fresh
# install whose address-hash-key comes from the environment gets none generated into this file.
# Values are checked like the ones here, and only the names of the variables are ever logged.

# H2 (a local file, the default), MARIADB, MYSQL or POSTGRESQL. Several servers sharing one
# MariaDB, MySQL or PostgreSQL database share their punishments.
type: H2

h2:
  # The H2 database file, in the plugin folder and without extension (sakurabans becomes
  # sakurabans.mv.db). Only used with type H2.
  file: sakurabans

# Connection to MariaDB, MySQL or PostgreSQL (ignored with H2).
host: localhost
# 0 uses the database's default port (3306, or 5432 for PostgreSQL); otherwise 1-65535.
port: 0
# The name of the database, which must already exist.
database: sakurabans
username: sakurabans
password: ''

# Prepended to every table name, so several plugins or networks can share a database: 1-16
# characters of a-z, 0-9 and _, starting with a letter. Changing it later points SakuraBans at
# new, empty tables.
table-prefix: sb_
# PostgreSQL schema, a lower-case name; empty uses the default (public).
schema: ''
# Extra JDBC connection properties, as name: 'value' pairs of the driver in use, for example:
#   useSSL: 'true'
properties: {}

# The secret key that turns IP addresses into keyed hashes (HMAC-SHA-256). SakuraBans matches
# address bans by these hashes, and an erased player's punished addresses are kept only as
# hashes. A new install gets a generated key here. Every server that uses one database needs
# the same key: copy this line to the storage.yml of each of them. Never change it once a
# database is in use: SakuraBans then refuses to start, because no stored hash would match.
# At least 32 characters. Keep it secret, like the password, and keep a copy with your backups.
address-hash-key: ''

pool:
  # The most connections open at once (1 or more).
  maximum-size: 10
  # Connections kept open while idle (0 up to maximum-size).
  minimum-idle: 2
  # How long to wait for a free connection (a duration: 5s, 30s, ...).
  connection-timeout: 5s
  # How long a connection is kept before it is replaced (a duration: 30m, 1h, ...). Keep it
  # shorter than the database's own connection time limit.
  max-lifetime: 30m

sync:
  # How several servers on one database tell each other about punishments: NONE, or SQL
  # (polling a table, for networks; needs MARIADB, MYSQL or POSTGRESQL). Without it, a mute or
  # unmute from another server reaches a player within about a minute, and a ban from another
  # server when the player next joins.
  mode: NONE
  # How often SQL sync checks for news, from 250ms to 30s (a duration: 500ms, 2s, ...).
  # Messages are ordered by the database's clock, so the servers' clocks don't have to agree
  # for sync. Expiry does use each server's own clock: SakuraBans warns at startup when a
  # server's clock is more than 5 seconds off the database's. Keep every server on NTP.
  poll-interval: 2s
