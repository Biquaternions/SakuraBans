# SakuraBans storage.
#
# Changes here need a restart; /sb reload keeps the current storage and says so. SakuraBans
# never rewrites this file.

# H2 (a local file, the default), MARIADB, MYSQL or POSTGRESQL. Several servers sharing one
# MariaDB, MySQL or PostgreSQL database share their punishments.
type: H2

h2:
  # The H2 database file, in the plugin folder and without extension (sakurabans becomes
  # sakurabans.mv.db). Only used with type H2.
  file: sakurabans

# Connection to MariaDB, MySQL or PostgreSQL (ignored with H2).
host: localhost
# 0 uses the database's default port (3306, or 5432 for PostgreSQL); otherwise 1-65535.
port: 0
# The name of the database, which must already exist.
database: sakurabans
username: sakurabans
password: ''

# Prepended to every table name, so several plugins or networks can share a database: 1-16
# characters of a-z, 0-9 and _, starting with a letter. Changing it later points SakuraBans at
# new, empty tables.
table-prefix: sb_
# PostgreSQL schema, a lower-case name; empty uses the default (public).
schema: ''
# Extra JDBC connection properties, as name: 'value' pairs of the driver in use, for example:
#   useSSL: 'true'
properties: {}

pool:
  # The most connections open at once (1 or more).
  maximum-size: 10
  # Connections kept open while idle (0 up to maximum-size).
  minimum-idle: 2
  # How long to wait for a free connection (a duration: 5s, 30s, ...).
  connection-timeout: 5s
  # How long a connection is kept before it is replaced (a duration: 30m, 1h, ...). Keep it
  # shorter than the database's own connection time limit.
  max-lifetime: 30m

sync:
  # How several servers on one database tell each other about punishments: NONE, or SQL
  # (polling a table, for networks; needs MARIADB, MYSQL or POSTGRESQL). Without it, a mute or
  # unmute from another server reaches a player within about a minute, and a ban from another
  # server when the player next joins.
  mode: NONE
  # How often SQL sync checks for news, from 250ms to 30s (a duration: 500ms, 2s, ...).
  poll-interval: 2s
