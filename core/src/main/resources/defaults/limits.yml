# SakuraBans limits: how long staff may punish, how often, and whether they must use templates.
#
# SakuraBans never rewrites this file. /sb reload applies changes.
#
# Staff are put in a group by its permission; the first group (in the order below) whose
# permission a staff member has applies to them, and staff in no group have no limits. The
# console and plugins are never limited. sakurabans.limits.unlimited ignores max-duration and
# require-template; sakurabans.cooldown.bypass ignores cooldowns.
#
# Keys of a group:
#   permission        the permission that puts staff in the group
#   max-duration      the longest ban, mute and warn (30m, 7d, 1mo, ...); permanent or left out
#                     means no limit. A permanent punishment counts as longer than any limit.
#   cooldown          how long to wait between two punishments of a type (ban, mute, warn, kick)
#   require-template  true: punishments need a template (#name)
#
# For example:
#   groups:
#     helper:
#       permission: sakurabans.group.helper
#       max-duration: {ban: 3d, mute: 1d, warn: 30d}
#       cooldown: {ban: 30s, mute: 10s, warn: 10s, kick: 10s}
#       require-template: true
#     moderator:
#       permission: sakurabans.group.moderator
#       max-duration: {ban: 30d, mute: 30d}
#       cooldown: {ban: 10s}

# Over the limit: true shortens the punishment to the group's maximum, false refuses it.
reduce-to-limit: true

groups: {}
