# SakuraBans configuration.
#
# SakuraBans never rewrites this file, so your comments stay. Keys added by a newer version use
# their defaults until you add them; they are listed in the log at startup. Durations use the
# punishment syntax: 30s, 10m, 1h30m, 7d, 2w, 1mo (30 days), 1y (365 days). Every duration here
# must be longer than zero.
# /sb reload applies changes; if any value is invalid, the old settings stay active (except
# commands.labels and geoip.enabled, which need a restart).
#
# A network may also hold overrides of these settings (and of messages) in the database; an
# override wins over this file. The log says at startup and on /sb reload which ones exist;
# /sb settings list and /sb messages list show them, /sb settings reset and /sb messages reset
# remove them.
#
# server.name, server.categories, web.token, geoip.enabled, geoip.account-id, geoip.license-key and
# geoip.refresh (and every key of storage.yml) can also be set by the environment, which wins over
# these files: SAKURABANS_SERVER_NAME, SAKURABANS_SERVER_CATEGORIES (comma-separated),
# SAKURABANS_WEB_TOKEN, SAKURABANS_GEOIP_ENABLED, SAKURABANS_GEOIP_ACCOUNT_ID,
# SAKURABANS_GEOIP_LICENSE_KEY, SAKURABANS_GEOIP_REFRESH, or one JSON object in SAKURABANS_CONFIG
# ({"server.name": "lobby"}; the single variables win over it). No other key is read from the
# environment; a SAKURABANS_ variable that names one is refused at startup with a hint.
#
# Install SakuraBans either on the Velocity proxy or on every Paper backend, never on both. On
# backends, share one MariaDB, MySQL or PostgreSQL database (storage.yml) so they share
# punishments.

server:
  # This server's name, used for server scopes and staff notices: 1-64 characters of a-z, 0-9,
  # _ and -, or empty for none. On a backend, set it to the name the network knows the server by
  # (its name in velocity.toml), so server:<name> and category punishments apply here; without
  # it, only global punishments and those of server.categories do. On a proxy, the name is only
  # the origin of punishments issued there (empty means "proxy").
  name: ''
  # Categories this server belongs to, so category:<name> punishments apply here (backends
  # only). Usually it's simpler to list servers under scopes.categories instead, which every
  # backend can share.
  categories: []

scopes:
  # Where a punishment applies when the command doesn't say: global, local, server:<name> or
  # category:<name>. local is this server (global while server.name is empty); on a proxy it
  # is the server the staff member is on (global from the console).
  default: global
  # Whether staff need permissions to use scopes: sakurabans.scope.global,
  # sakurabans.scope.server.<name> and sakurabans.scope.category.<name> to punish in a scope or
  # revoke a punishment in it, and sakurabans.scope.default to punish without naming a scope.
  require-permissions: false
  # Categories (groups of servers) and the servers in them, so category:<name> punishments apply
  # on those servers. On backends, keep this the same on every backend, so each knows the
  # categories of the others. For example:
  #   categories:
  #     minigames: [bedwars-1, bedwars-2, skywars]
  #     survival: [survival, survival-nether]
  categories: {}

web:
  # The address of the web editor that /sb editor and /sb applyedits use, for example
  # https://editor.example.org (https://, or http:// for a loopback or private address). Empty
  # turns the editor off; settings, messages and templates still work through the files and
  # commands. The editor site never sees your data: it stores encrypted blobs, which it deletes
  # after a day, and the key stays in the link. The SakuraBans documentation explains how to host
  # your own copy of the site.
  url: ''
  # The upload token, if the editor site asks for one (empty for none). Keep it secret.
  token: ''
  # Whether a save in the editor applies by itself while its tab stays open (as in LuckPerms):
  # the server that opened the session stays connected to the editor site while the tab is
  # open and applies each save with the permissions of whoever opened it, who sees what
  # changed. false: every save needs /sb applyedits <code>.
  live-apply: true

enforcement:
  # How far address bans reach through shared addresses: LENIENT (that address only), NORMAL
  # (accounts that joined from it), STERN (one more hop) or STRICT (player bans also cover all of
  # the player's addresses).
  address-strictness: NORMAL
  # Whether /ban also bans the player's current address unless told otherwise.
  composite-by-default: false
  # Commands a muted player can't use, without the slash. An entry also matches the command under
  # a plugin's namespace (msg blocks essentials:msg and minecraft:msg). Use * for any text:
  # *:me blocks every namespaced me, minecraft:* every vanilla command, e* every command
  # starting with e. Quote an entry that starts with * ('*:me'). An entry with a colon is
  # matched against the whole label.
  mute-command-blacklist:
  - me
  - say
  - tell
  - msg
  - w
  - whisper
  - r
  - reply
  - mail
  # Kick reasons that leave no record: /kick with a reason containing one of these texts (any
  # case) disconnects the player with the kick screen but stores no kick, tells no staff and
  # posts no webhook, like /kick --no-record. Meant for "Restarting" and "AFK". The API's
  # punish is not affected. [] records every kick.
  kick-ignored-reasons:
  - restarting
  - afk
  # On a proxy, whether server scopes are checked when a player switches servers.
  enforce-server-switch: true
  # How long a join or server switch may wait for the ban check (at most 30s). If the check
  # takes longer or fails (for example, the database is down), the player is turned away.
  login-check-timeout: 5s
  # On a proxy: servers a banned player may still join (a lobby, a limbo, an appeal server). A
  # banned player is let into the network and can only reach these servers; they are told they
  # are banned when they join, and staff aren't told of the join. When a ban is enforced on a
  # player who is online, the proxy sends them to the first of these servers (in this order)
  # that it can connect them to, then to its own fallback servers where the ban doesn't apply;
  # if none connects, they are disconnected. A player already on one of them stays there and
  # is told. Mutes still apply on these servers. A non-empty list checks every server switch,
  # whatever enforce-server-switch says. Ignored on a backend (see login-check).
  servers-without-login-check: []
  # On a backend (Paper): false lets banned players join this server (a lobby or limbo server
  # behind a proxy with SakuraBans on the backends). They are told they are banned when they
  # join, a ban enforced while they are here doesn't kick them, and mutes still apply. Each
  # backend decides for itself. Ignored on a proxy.
  login-check: true
  # On a backend behind a proxy (BungeeCord or Velocity with bungee-plugin-message-channel
  # enabled): true makes a ban enforced on an online player disconnect them from the whole
  # network, by asking the proxy through the BungeeCord plugin channel (KickPlayerRaw, then
  # KickPlayer with the screen as legacy text). If the proxy hasn't disconnected them after
  # 2 seconds, or the channel isn't available, they are kicked from this server instead.
  # false (the default) kicks them from this server only, so the proxy sends them to its
  # fallback server. Bans only: /kick always kicks from this server. A banned player's login
  # to a backend is refused before they are a player there, so where the proxy sends them is
  # the proxy's decision. Ignored on a proxy.
  network-kick: false
  # After how long a ban of a player and an address (/ban with --ip, or composite-by-default)
  # stops reaching through the address and bans the player only: a duration, or never. Decided
  # by the ban's age each time it is checked, so nothing is rewritten and changing this takes
  # effect at once both ways. Plain address bans (/ipban of an address), ranges and mutes are
  # not affected. /checkban, /sb info and the lists say when a ban's address part has decayed.
  ip-ban-decay: never

alts:
  # Whether names and addresses are recorded when players join.
  register-on-connection: true
  # Servers that never record addresses (login or limbo servers behind a proxy).
  servers-without-ip-registration:
  - auth
  - limbo
  # How long recorded addresses count for alt detection: a duration, or never.
  record-expiration: never
  join-notification:
    # Whether staff (sakurabans.alts.notify) are told about a joining player's alts, at the
    # configured address strictness. At most once per player per 30 minutes.
    enabled: true
    # Only when one of the alts has an active punishment.
    only-if-punished: true
    # The fewest alts that trigger a notice.
    threshold: 2
    # The most alts listed in one notice.
    limit: 20
  # Accounts and addresses that /alts, /ipreport and the join notification never list (staff
  # accounts, a shared office or school address): player names, UUIDs, addresses or ranges
  # (10.0.0.0/8, 10.0.*.*). An alt linked only through hidden addresses isn't listed either, and
  # a hidden player joining tells no one about their alts. Staff with sakurabans.alts.viewhidden
  # (and the console) still see everything. For example:
  #   hidden-players:
  #   - Notch
  #   - 069a79f4-44e9-4726-a5be-fca90e38aaf5
  #   - 203.0.113.7
  hidden-players: []
  # Automatic alt bans: DISABLED, ON_BAN (a ban of a player, from a command or the API, also
  # bans the accounts /alts lists for them, at address-strictness and record-expiration, that
  # aren't allow-listed, hidden, exempt or already banned there: same reason, scope and expiry,
  # by the same operator, with the source "auto"; one notice instead of one per account) or
  # ON_JOIN (also: an account that joins while an address or composite ban reaches it is banned
  # itself, with that ban's reason, scope and expiry). Nothing happens until the console runs
  # /sb accept alts once; until then the startup log and /sb status remind you. An automatic ban
  # never starts another round, and revoking the first ban does not lift the bans it made: undo
  # them with /staffrollback, or find them by their source "auto". LiteBans' third level
  # ("extreme") is not offered.
  auto-ban: DISABLED
  # A /ban that would also ban more linked accounts than this needs --confirm (0: always).
  auto-ban-confirm-above: 5

reasons:
  # The reason used when none is given (at most 1024 characters).
  default: No reason specified
  # Punishments that need a reason.
  require:
    ban: false
    mute: false
    warn: false
    kick: false
    # Revocations (unban, unmute, unwarn).
    revoke: false
  # Whether reasons may contain line breaks.
  allow-newlines: false
  # Reason shortcuts: with "griefing: Griefing", /ban Steve --template griefing uses "Griefing"
  # as the reason (a reason given with -r is added after it). A template with the same name
  # wins; see templates.yml.
  # Names are 1-64 characters of a-z, 0-9, _ and -; a reason is 1-1024 characters. For example:
  #   shortcuts:
  #     griefing: Griefing
  #     language: Inappropriate language
  shortcuts: {}

exemption:
  # Who can't be punished: NONE, PERMISSION (sakurabans.exempt.<type>) or LUCKPERMS_WEIGHT
  # (staff can't punish someone with a higher group weight; needs LuckPerms).
  provider: PERMISSION
  # With LUCKPERMS_WEIGHT: whether staff may punish someone with the same weight.
  permit-same-weight: true
  # Whether exemption also protects punishments from being edited or revoked by lower staff.
  protects-edits: true
  # Players who can't be punished, whatever the provider says: a name or a UUID, optionally
  # followed by a type (:ban, :mute, :warn or :kick) to exempt them from that type only. A name
  # matches only while this server knows the player's name (they are online, or were looked up
  # since the start); an unknown name matches nobody until then, so prefer UUIDs. Staff with
  # sakurabans.<type>.exempt.bypass and the console still may. For example:
  #   players:
  #   - 069a79f4-44e9-4726-a5be-fca90e38aaf5
  #   - Steve:mute
  players: []
  # LuckPerms groups whose members can't be punished (checked as the group.<name> permission,
  # so offline players need LuckPerms).
  groups: []

warnings:
  # How long a warning stays active: a duration, or never.
  expire-after: 30d
  # Console commands run when a player reaches a number of active warnings (in every scope),
  # on the server that issued the warning that reached it. The keys are numbers of warnings (1
  # or more); each runs when the count is exactly that number. Placeholders: {victim} (the
  # name), {uuid}, {address}, {id} (the warning), {operator}, {reason}, {duration} and {count}.
  # Quote the commands, because YAML reads {...} as a section. For example:
  #   actions:
  #     3: ["tempmute {victim} 1h Three active warnings"]
  #     5: ["tempban {victim} 1d Five active warnings"]
  actions: {}

display:
  # The language for messages when the player's own isn't known (for example ban screens).
  default-locale: en_US
  # How dates are shown (a java.time pattern, for example dd MMM yyyy HH:mm).
  date-format: dd MMM yyyy HH:mm
  # The time zone for dates: default (the server's), UTC, Europe/Berlin, ...
  timezone: default
  # How punishment ids are shown: NUMERIC, SCRAMBLED or BOTH.
  id-style: NUMERIC
  # Whether addresses are shown as 203.0.*.* to staff without sakurabans.viewips.
  censor-ip-addresses: false

lockdown:
  # Whether an active lockdown survives a restart.
  persist: true

notifications:
  # The shortest time between two "tried to join while banned" or "tried to chat while muted"
  # notices about the same player (a duration, for example 30s).
  # 0s turns the throttle off: every attempt is announced.
  attempt-throttle: 30s

players:
  # Whether a name SakuraBans has never seen (for example /ban on someone who never joined) is
  # looked up through the server's profile service, which asks Mojang. Turn it off on shared
  # hosting, where every server on the address shares Mojang's rate limit; such names then only
  # resolve through integrations. A proxy never looks names up.
  remote-lookup: true

audit:
  # How long audit entries (/sb audit) are kept: a duration (for example 365d) or never. Older
  # entries are deleted in small batches by the server that holds the sweeper's lease, checked
  # about once an hour, by this server's clock (the clock that stamps the entries). Deleting
  # isn't audited entry by entry; one line in the console says how many went. The entries of a
  # punishment ("changes" in /sb info) go the same way.
  retention: never

placeholders:
  # How often each server reads the network's punishment counts again: the <total_bans>,
  # <total_mutes>, <total_warns>, <total_kicks>, <active_bans>, <active_mutes> and
  # <active_warns> tags any message may use, and the sakurabans_total_* and sakurabans_active_*
  # placeholders of MiniPlaceholders and PlaceholderAPI (a duration, at least 30s). Until the
  # first read after a start they are empty. A player's own counts (<player_bans>,
  # sakurabans_player_bans, ...) are read when they join and whenever one of their punishments
  # changes, not on this interval. No placeholder ever waits for the database. See the
  # placeholders page of the documentation for the full list.
  refresh: 2m

geoip:
  # Looks up the country of players' addresses in a MaxMind GeoLite2-Country database, kept in
  # this folder as geoip/GeoLite2-Country.mmdb, for the country lists below, /geoip and the
  # <country> tag. Off by default; a change needs a restart. Every server that turns it on keeps
  # its own copy of the database. Lookups are made in memory: no address leaves the server.
  enabled: false
  # Your MaxMind account ID and one of its licence keys (a free GeoLite account at
  # maxmind.com), with which this server downloads the database and keeps it up to date. Keep
  # both secret. Leave both empty to place the file yourself: it is then used as it is, and a
  # newer copy put in its place is picked up within an hour.
  account-id: ''
  license-key: ''
  # How often MaxMind is asked whether there is a newer database: a duration of at least 1d, or
  # never (a database is then only downloaded when there is none). Asking doesn't count against
  # MaxMind's daily download limit; only a newer database is downloaded. MaxMind publishes
  # GeoLite2 twice a week.
  refresh: 7d
  # Countries whose players can't join, as ISO 3166-1 alpha-2 codes (for example [CN, RU]).
  # Checked when a player joins (the proxy, or this backend), after the ban check, also where
  # banned players are let in (enforcement.servers-without-login-check, login-check: false);
  # never on a proxy's server switch. Players and addresses on the allow list (/sb allow add)
  # pass, and so do players with sakurabans.geoip.bypass, but that permission is only known at
  # login through LuckPerms: without it, use the allow list. A player turned away sees
  # screen.geoip, and staff with sakurabans.notify.attempt.join are told; nothing is recorded.
  blacklist: []
  # When not empty, only players from these countries can join (for example [DE, AT, CH]); the
  # blacklist is then ignored.
  whitelist: []
  # Whether a player whose country isn't known may join while a list is set: a local or private
  # address (a LAN), an address the database doesn't list, or no database yet.
  allow-unknown: true

commands:
  # The labels of each command; the first is its name, the rest are aliases (1-32 characters of
  # a-z, 0-9, _ and -). A command left out uses its own name, except that /alts also answers to
  # dupeip and /warns to warnings; list a command to replace its labels, and an empty list ([])
  # disables it.
  # Changes need a restart. The /sb subcommands (help, status, reload, info, edit, delete,
  # evidence, allow, templates, settings, messages, editor, applyedits, gdpr, import, unlink,
  # reset and addlogin)
  # follow the sakurabans labels.
  # Commands: sakurabans, ban, tempban, ipban, mute, tempmute, ipmute, warn, kick, punish
  # (ladders), unban, pardon (unban under vanilla's name), unmute, unwarn, checkban, checkmute,
  # checkwarn, history, staffhistory, warns, banlist, mutelist, warnlist, alts, iphistory,
  # namehistory, lastuuid, ipreport, geoip, lockdown, staffrollback, prunehistory.
  labels:
    sakurabans: [sakurabans, sb]
    alts: [alts, dupeip]
    warns: [warns, warnings]
