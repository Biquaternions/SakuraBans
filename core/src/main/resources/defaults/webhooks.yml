# SakuraBans Discord webhooks.
#
# SakuraBans never rewrites this file. Only the server where something happens posts it, so a
# network posts each punishment once. /sb reload applies changes.

# Whether webhooks are sent at all.
enabled: false
# The webhook URL routes use unless they name their own (Server settings > Integrations >
# Webhooks in Discord). An http(s) URL.
url: ""
# The name and avatar the messages show (avatar-url is an http(s) URL, or empty for Discord's
# own avatar of the webhook).
username: SakuraBans
avatar-url: ""
# Whether silent punishments are posted (hidden ones never are).
include-silent: false

# One route per event: ban, mute, warn, kick, unban, unmute, unwarn, void, delete, edit and
# rollback. An event without a route, or with enabled: false, is not posted. Each route has its
# own url (empty: the one above; one of the two must be set) and an embed: title, color
# (#rrggbb), description and fields (name: text, at most 25, shown in this order; a field whose
# text comes out empty is left out). Texts may use Discord markdown and these placeholders:
# {victim} {uuid} {address} {id} (the number) {display_id} (the id as display.id-style shows
# it) {operator} {reason} {duration} {expires} {type} {scope} {server} (where it was issued)
# {revoker} {revoke_reason} {edit} (what changed, edit only) and {count}. The rollback
# route only knows {victim} (the staff member whose punishments were lifted), {revoker},
# {revoke_reason} and {count} (how many).
routes:
  ban:
    enabled: true
    url: ""
    title: Ban
    color: "#e74c3c"
    description: "{victim} was banned by {operator}"
    fields:
      Reason: "{reason}"
      Duration: "{duration}"
      Scope: "{scope}"
      Id: "#{display_id}"
  mute:
    enabled: true
    url: ""
    title: Mute
    color: "#e67e22"
    description: "{victim} was muted by {operator}"
    fields:
      Reason: "{reason}"
      Duration: "{duration}"
      Scope: "{scope}"
      Id: "#{display_id}"
  warn:
    enabled: true
    url: ""
    title: Warning
    color: "#f1c40f"
    description: "{victim} was warned by {operator}"
    fields:
      Reason: "{reason}"
      Id: "#{display_id}"
  kick:
    enabled: true
    url: ""
    title: Kick
    color: "#f39c12"
    description: "{victim} was kicked by {operator}"
    fields:
      Reason: "{reason}"
  unban:
    enabled: true
    url: ""
    title: Unban
    color: "#2ecc71"
    description: "{victim} was unbanned by {revoker}"
    fields:
      Reason: "{revoke_reason}"
      Id: "#{display_id}"
  unmute:
    enabled: true
    url: ""
    title: Unmute
    color: "#2ecc71"
    description: "{victim} was unmuted by {revoker}"
    fields:
      Reason: "{revoke_reason}"
      Id: "#{display_id}"
  unwarn:
    enabled: true
    url: ""
    title: Warning removed
    color: "#2ecc71"
    description: "A warning of {victim} was removed by {revoker}"
    fields:
      Id: "#{display_id}"
  void:
    enabled: true
    url: ""
    title: Voided
    color: "#95a5a6"
    description: "The {type} of {victim} was voided by {revoker}"
    fields:
      Reason: "{revoke_reason}"
      Id: "#{display_id}"
  delete:
    enabled: true
    url: ""
    title: Deleted
    color: "#7f8c8d"
    description: "The {type} of {victim} was deleted"
    fields:
      Id: "#{display_id}"
  edit:
    enabled: true
    url: ""
    title: Changed
    color: "#3498db"
    description: "The {type} of {victim} was changed: {edit}"
    fields:
      Id: "#{display_id}"
  rollback:
    enabled: true
    url: ""
    title: Staff rollback
    color: "#9b59b6"
    description: "{count} punishments by {victim} were lifted by {revoker}"
    fields:
      Reason: "{revoke_reason}"
