# SakuraBans messages, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
#
# SakuraBans never rewrites this file. Keys missing here fall back to the built-in English text,
# and are listed in the log at startup. To translate, copy this file to lang/<locale>.yml (for
# example de_DE.yml); missing keys there fall back to en_US.
#
# <prefix> inserts the prefix below into any message. Values that come from players or staff
# (names, reasons) are always shown as plain text.

prefix: '<#f4a7b9>SakuraBans</#f4a7b9> <dark_gray>»</dark_gray> '

error:
  internal: '<prefix><red>Something went wrong. Please tell an administrator (incident <id>).</red>'
  not_ready: '<prefix><red>SakuraBans is still starting. Try again in a moment.</red>'
  no_permission: '<prefix><red>You don''t have permission to do that.</red>'

operator:
  console: Console

type:
  ban: ban
  mute: mute
  warn: warning
  kick: kick

scope:
  global: everywhere
  server: 'server <name>'
  category: 'category <name>'

time:
  permanent: permanent
  never: never
  separator: ', '
  last_separator: ' and '
  second: '<count> second'
  seconds: '<count> seconds'
  minute: '<count> minute'
  minutes: '<count> minutes'
  hour: '<count> hour'
  hours: '<count> hours'
  day: '<count> day'
  days: '<count> days'
  year: '<count> year'
  years: '<count> years'

# Disconnect screens. Placeholders: <reason> <operator> <duration> <remaining> <expires> <id>
# <display_id> <scope> <type> <kind> <server>.
screen:
  ban: |-
    <red><bold>You are banned.</bold></red>

    <gray>Reason:</gray> <white><reason></white>
    <gray>Banned by:</gray> <white><operator></white>

    <dark_gray>Punishment <display_id></dark_gray>
  ban_temporary: |-
    <red><bold>You are banned.</bold></red>

    <gray>Reason:</gray> <white><reason></white>
    <gray>Banned by:</gray> <white><operator></white>
    <gray>Ends in:</gray> <white><remaining></white>

    <dark_gray>Punishment <display_id></dark_gray>
  kick: |-
    <red><bold>You were kicked.</bold></red>

    <gray>Reason:</gray> <white><reason></white>

# Sent to the punished player.
victim:
  muted: '<prefix><red>You were muted by <operator>: <reason></red>'
  muted_temporary: '<prefix><red>You were muted by <operator> for <duration>: <reason></red>'
  warned: '<prefix><red>You were warned by <operator>: <reason></red>'

# When a muted player chats or runs a blocked command.
chat:
  muted: '<prefix><red>You are muted: <reason></red>'
  muted_temporary: '<prefix><red>You are muted for <remaining>: <reason></red>'
  command_muted: '<prefix><red>You can''t use this command while you are muted.</red>'
  loading: '<prefix><gray>Your chat is still being checked. Try again in a moment.</gray>'

# Staff notices. <silent> is the silent tag below for silent punishments, else empty.
notify:
  silent_tag: '<gray>[Silent]</gray> '
  ban: '<prefix><silent><white><operator></white> <red>banned</red> <white><victim></white> <gray>(<duration>, <scope>):</gray> <reason>'
  mute: '<prefix><silent><white><operator></white> <red>muted</red> <white><victim></white> <gray>(<duration>, <scope>):</gray> <reason>'
  warn: '<prefix><silent><white><operator></white> <yellow>warned</yellow> <white><victim></white><gray>:</gray> <reason>'
  kick: '<prefix><silent><white><operator></white> <yellow>kicked</yellow> <white><victim></white><gray>:</gray> <reason>'
  unban: '<prefix><silent><white><revoker></white> <green>unbanned</green> <white><victim></white>'
  unmute: '<prefix><silent><white><revoker></white> <green>unmuted</green> <white><victim></white>'
  unwarn: '<prefix><silent><white><revoker></white> <green>removed a warning of</green> <white><victim></white>'
  attempt_join: '<prefix><gray><name> tried to join but is banned:</gray> <reason>'
  attempt_chat: '<prefix><gray><name> tried to chat but is muted:</gray> <message>'
