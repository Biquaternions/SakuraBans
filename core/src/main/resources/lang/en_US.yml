# SakuraBans messages, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
#
# SakuraBans never rewrites this file. Keys missing here fall back to the built-in English text,
# and are listed in the log at startup. To translate, copy this file to lang/<locale>.yml (for
# example de_DE.yml); missing keys there fall back to en_US.
#
# <prefix> inserts the prefix below into any message. Values that come from players or staff
# (names, reasons) are always shown as plain text.
#
# Style tags, usable in every message (and in templates' messages):
#   <plugin>   the plugin's name as defined by "plugin" below (a gradient by default).
#   <prefix>   "prefix" below: <plugin> and a separator, put before the plugin's own replies.
#   <main>...</main>, <accent>...</accent>, <highlight>...</highlight>, <danger>...</danger>
#              the palette: colours defined once under "palette" (#rrggbb or a colour name).
# The palette is for the plugin's own replies (command results, errors, lists, help, status):
#   main       #F591FF  running text and labels
#   accent     #B891FF  values: names, ids, counts, keys; and the prefix's separator
#   highlight  #FF91BF  warnings and confirmations ("Run it again with --confirm")
#   danger     red      errors and refusals
# What a punished player sees and the staff notices of punishments (screen.*, victim.*,
# dialog.*, chat.*, notify.*) use named colours instead (light_purple, red, blue, white, gray),
# so they can be changed one by one without touching the palette. The help menu takes the
# palette when the plugin starts (a reload doesn't recolour it).
#
# --- Punishment counts ------------------------------------------------------------------------
# Usable in every message (and in templates' messages), none used by the texts below:
#   <total_bans> <total_mutes> <total_warns> <total_kicks>  every punishment of the type on the
#              network that wasn't voided, revoked and expired ones included
#   <active_bans> <active_mutes> <active_warns>  the ones in force now
#   They are read again every placeholders.refresh (config.yml) and are empty until the first
#   read after a start.
# Usable where a message shows a punishment of a player (screen.*, victim.*, dialog.*, chat.*,
# notify.*, check.detail, list.entry, the punish/void/delete replies), for its victim:
#   <player_bans> <player_mutes> <player_warns> <player_kicks>  what they received, in every
#              scope, voided ones left out
#   <player_active_warns>  their warnings in force
#   Empty when unknown: for an address victim, or for a player who isn't online on this server,
#   except in staff notices, /check #id and /sb info, which read them first when the text uses
#   them. In what the punished player is shown, <player_mutes> leaves out shadow mutes.
#
# --- Country ----------------------------------------------------------------------------------
#   <country>  the English name of the country of an address, from the GeoIP database (geoip in
#              config.yml); empty while GeoIP is off on this server or the country isn't known,
#              except in screen.geoip and notify.attempt_geoip, which show geoip.unknown_country.
#   Usable, besides the GeoIP texts, in: notify.attempt_join and notify.alts.join (the joining
#   player's address), alts.entry (the shared addresses), iphistory.entry (that address) and
#   check.detail (an address punishment's address; empty for a player's). The texts below use it
#   only in the GeoIP texts.
# ----------------------------------------------------------------------------------------------

plugin: '<gradient:#F591FF:#FFFFFF:#F591FF>SakuraBans</gradient>'
prefix: '<plugin> <accent>...🖉</accent> '

palette:
  main: '#F591FF'
  accent: '#B891FF'
  highlight: '#FF91BF'
  danger: red

error:
  internal: '<prefix><danger>Something went wrong. Please tell an administrator (incident <id>).</danger>'
  not_ready: '<prefix><danger><plugin> is still starting. Try again in a moment.</danger>'
  no_permission: '<prefix><danger>You don''t have permission to do that.</danger>'

operator:
  console: Console

type:
  ban: ban
  mute: mute
  warn: warning
  kick: kick

scope:
  global: everywhere
  server: 'server <name>'
  category: 'category <name>'

time:
  permanent: permanent
  never: never
  separator: ', '
  last_separator: ' and '
  second: '<count> second'
  seconds: '<count> seconds'
  minute: '<count> minute'
  minutes: '<count> minutes'
  hour: '<count> hour'
  hours: '<count> hours'
  day: '<count> day'
  days: '<count> days'
  year: '<count> year'
  years: '<count> years'

# Disconnect screens. Placeholders: <victim> <created> <reason> <operator> <duration> <remaining>
# <expires> <id> <display_id> <scope> <type> <server>. <st>  </st> (struck-through spaces) draws
# the rules. A permanent ban shows "never" for <expires> and "permanent" for <remaining>.
screen:
  ban: |-
    <plugin>
    <light_purple><st>          </st></light_purple>

    <light_purple>Username:</light_purple> <white><victim></white>
    <light_purple>Issued on:</light_purple> <white><created></white>
    <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>Reason:</light_purple> <red><reason></red>

    <light_purple>Expires on:</light_purple> <white><expires></white>
    <light_purple>Expiration:</light_purple> <white><remaining></white>

    <light_purple><st>          </st></light_purple>

    <blue>ID:</blue> <white><display_id></white>
  ban_temporary: |-
    <plugin>
    <light_purple><st>          </st></light_purple>

    <light_purple>Username:</light_purple> <white><victim></white>
    <light_purple>Issued on:</light_purple> <white><created></white>
    <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>Reason:</light_purple> <red><reason></red>

    <light_purple>Expires on:</light_purple> <white><expires></white>
    <light_purple>Expiration:</light_purple> <white><remaining></white>

    <light_purple><st>          </st></light_purple>

    <blue>ID:</blue> <white><display_id></white>
  kick: |-
    <plugin>
    <light_purple><st>          </st></light_purple>

    <light_purple>Username:</light_purple> <white><victim></white>
    <light_purple>Issued on:</light_purple> <white><created></white>
    <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>Reason:</light_purple> <red><reason></red>

    <light_purple><st>          </st></light_purple>

    <blue>ID:</blue> <white><display_id></white>
  # A kick that leaves no record (--no-record, enforcement.kick-ignored-reasons): only the
  # player's name and the reason are known. Placeholders: <victim> <reason>.
  kick_unrecorded: |-
    <plugin>
    <light_purple><st>          </st></light_purple>

    <light_purple>Username:</light_purple> <white><victim></white>
    <light_purple>Reason:</light_purple> <red><reason></red>

    <light_purple><st>          </st></light_purple>
  check_failed: |-
    <plugin>
    <light_purple><st>          </st></light_purple>

    <red>We couldn't check your account.</red>
    <white>Please try again in a moment.</white>

    <light_purple><st>          </st></light_purple>
  lockdown: |-
    <plugin>
    <light_purple><st>          </st></light_purple>

    <red>This server is locked down.</red>
    <light_purple>Reason:</light_purple> <white><reason></white>
    <white>Please try again later.</white>

    <light_purple><st>          </st></light_purple>
  # A login turned away by geoip.blacklist, geoip.whitelist or geoip.allow-unknown (config.yml).
  # Placeholders: <country> (geoip.unknown_country when the country isn't known).
  geoip: |-
    <plugin>
    <light_purple><st>          </st></light_purple>

    <red>You can't join this server from where you are.</red>
    <light_purple>Country:</light_purple> <white><country></white>

    <light_purple><st>          </st></light_purple>

# Sent to the punished player. The mute notice and the warnings are a banner: a 7x7 block of
# squares with an exclamation mark drawn in a second colour (a space is narrower than a square
# in Minecraft's font, so the mark can't be left blank), and the text to its right.
victim:
  # How a punishment names an address removed by /sb gdpr erase.
  erased_address: erased address
  # A banned player on a server that lets banned players in (enforcement.servers-without-login-check
  # on a proxy, enforcement.login-check: false on a backend): when they join, and when a ban is
  # enforced while they are there or sends them there.
  banned_admitted: '<prefix><red>You are banned from this network by <white><operator></white>: <white><reason></white>. You can only play on the servers that let banned players in.</red>'
  banned_admitted_temporary: '<prefix><red>You are banned from this network by <white><operator></white> for <white><remaining></white>: <white><reason></white>. You can only play on the servers that let banned players in.</red>'
  muted: |-
    <red>■■■■■■■</red>
    <red>■■■<white>■</white>■■■</red>  <red><bold>Muted</bold></red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■<white>■</white>■■■</red>  <light_purple>Staff:</light_purple> <white><operator></white>
    <red>■■■■■■■</red>  <light_purple>Expiration:</light_purple> <white><remaining></white>
    <red>■■■<white>■</white>■■■</red>  <light_purple>Reason:</light_purple> <white><reason></white>
    <red>■■■■■■■</red>
  muted_temporary: |-
    <red>■■■■■■■</red>
    <red>■■■<white>■</white>■■■</red>  <red><bold>Muted</bold></red> <light_purple>for</light_purple> <white><duration></white>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■<white>■</white>■■■</red>  <light_purple>Staff:</light_purple> <white><operator></white>
    <red>■■■■■■■</red>  <light_purple>Expiration:</light_purple> <white><remaining></white>
    <red>■■■<white>■</white>■■■</red>  <light_purple>Reason:</light_purple> <white><reason></white>
    <red>■■■■■■■</red>
  warned: |-
    <light_purple>■■■■■■■</light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>  <light_purple><bold>Warned</bold></light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>  <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>■■■■■■■</light_purple>  <light_purple>Expiration:</light_purple> <white><remaining></white>
    <light_purple>■■■<white>■</white>■■■</light_purple>  <light_purple>Reason:</light_purple> <white><reason></white>
    <light_purple>■■■■■■■</light_purple>
  warned_away: |-
    <light_purple>■■■■■■■</light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>  <light_purple><bold>Warned while you were away</bold></light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>  <light_purple>Issued on:</light_purple> <white><created></white>
    <light_purple>■■■<white>■</white>■■■</light_purple>  <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>■■■■■■■</light_purple>  <light_purple>Expiration:</light_purple> <white><remaining></white>
    <light_purple>■■■<white>■</white>■■■</light_purple>  <light_purple>Reason:</light_purple> <white><reason></white>
    <light_purple>■■■■■■■</light_purple>

# A template with "display: dialog" shows the mute notice or the warning in a dialog with this
# title, the text below (or the template's own message) and this button. Where a dialog can't be
# shown, the chat text above is sent.
dialog:
  muted_title: '<red>You were muted</red>'
  warned_title: '<light_purple>You were warned</light_purple>'
  close: 'Close'
  # The dialog's text when the template has no message of its own (with one, the dialog shows
  # that message, as chat would). Placeholders: those of victim.muted and victim.warned.
  muted: |-
    <red>■■■■■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■■■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■■■■■</red>

    <red><bold>Muted</bold></red>
    <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>Expiration:</light_purple> <white><remaining></white>
    <light_purple>Reason:</light_purple> <white><reason></white>
  muted_temporary: |-
    <red>■■■■■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■■■■■</red>
    <red>■■■<white>■</white>■■■</red>
    <red>■■■■■■■</red>

    <red><bold>Muted</bold></red> <light_purple>for</light_purple> <white><duration></white>
    <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>Expiration:</light_purple> <white><remaining></white>
    <light_purple>Reason:</light_purple> <white><reason></white>
  warned: |-
    <light_purple>■■■■■■■</light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>
    <light_purple>■■■■■■■</light_purple>
    <light_purple>■■■<white>■</white>■■■</light_purple>
    <light_purple>■■■■■■■</light_purple>

    <light_purple><bold>Warned</bold></light_purple>
    <light_purple>Staff:</light_purple> <white><operator></white>
    <light_purple>Expiration:</light_purple> <white><remaining></white>
    <light_purple>Reason:</light_purple> <white><reason></white>

# When a muted player chats or runs a blocked command.
chat:
  muted: '<prefix><red>You are muted: <white><reason></white></red>'
  muted_temporary: '<prefix><red>You are muted for <white><remaining></white>: <white><reason></white></red>'
  command_muted: '<prefix><red>You can''t use this command while you are muted.</red>'
  loading: '<prefix><light_purple>Your chat is still being checked. Try again in a moment.</light_purple>'
  # Velocity only: a shadow-muted player's chat is dropped on the proxy and this line is shown to
  # them alone, so they think it was sent. The proxy can't know the backends' chat format: make
  # this look like your servers' chat. Default: vanilla's "<Name> message".
  shadow_echo: '\<<player>> <message>'

# Staff notices. <silent> is the silent tag below for silent punishments, else empty.
notify:
  silent_tag: '<gray>[Silent]</gray> '
  ban: '<prefix><silent><white><operator></white> <red>banned</red> <white><victim></white> <gray>(<duration>, <scope>):</gray> <light_purple><reason></light_purple>'
  # alts.auto-ban: the linked accounts banned along with a ban, in one notice.
  alts_auto_banned: '<prefix><silent><gray>Along with</gray> <blue>#<display_id></blue><gray>, <white><operator></white> also banned <white><count></white> linked accounts of</gray> <white><victim></white><gray>:</gray> <names>'
  mute: '<prefix><silent><white><operator></white> <red>muted</red> <white><victim></white> <gray>(<duration>, <scope>):</gray> <light_purple><reason></light_purple>'
  warn: '<prefix><silent><white><operator></white> <light_purple>warned</light_purple> <white><victim></white><gray>:</gray> <light_purple><reason></light_purple>'
  kick: '<prefix><silent><white><operator></white> <light_purple>kicked</light_purple> <white><victim></white><gray>:</gray> <light_purple><reason></light_purple>'
  unban: '<prefix><silent><white><revoker></white> <blue>unbanned</blue> <white><victim></white>'
  unmute: '<prefix><silent><white><revoker></white> <blue>unmuted</blue> <white><victim></white>'
  unwarn: '<prefix><silent><white><revoker></white> <blue>removed a warning of</blue> <white><victim></white>'
  attempt_join: '<prefix><gray><white><name></white> tried to join but is banned (<duration>, by <white><operator></white>):</gray> <light_purple><reason></light_purple>'
  attempt_chat: '<prefix><gray><white><name></white> tried to chat but is muted:</gray> <light_purple><message></light_purple>'
  # A login turned away by the GeoIP country lists; <country> is geoip.unknown_country when it
  # isn't known.
  attempt_geoip: '<prefix><gray><white><name></white> tried to join from a country that isn''t allowed:</gray> <light_purple><country></light_purple>'
  alts:
    join: '<prefix><white><name></white> <gray>joined with <white><count></white> known alts:</gray> <alts>'
    name: '<white><name></white>'
    punished_name: '<red><name></red>'

# Commands. Captions (command.caption.*) are the errors of the command framework; their
# placeholders are the framework's variables.
command:
  caption:
    argument:
      parse:
        failure:
          boolean: '<danger>''<input>'' is not true or false.</danger>'
          number: '<danger>''<input>'' is not a number from <min> to <max>.</danger>'
          char: '<danger>''<input>'' is not a single character.</danger>'
          string: '<danger>''<input>'' is not valid text here.</danger>'
          uuid: '<danger>''<input>'' is not a UUID.</danger>'
          enum: '<danger>''<input>'' is not one of <acceptableValues>.</danger>'
          regex: '<danger>''<input>'' doesn''t match <pattern>.</danger>'
          flag:
            unknown: '<danger>Unknown flag <flag>.</danger>'
            duplicate_flag: '<danger>The flag <flag> is given twice.</danger>'
            no_flag_started: '<danger>''<input>'' isn''t a flag. Flags start with - or --.</danger>'
            missing_argument: '<danger>The flag <flag> needs a value.</danger>'
            no_permission: '<danger>You can''t use the flag <flag>.</danger>'
          color: '<danger>''<input>'' is not a color.</danger>'
          duration: '<danger>''<input>'' is not a duration (like 30m, 7d or 1mo).</danger>'
          aggregate:
            missing: '<danger>Missing <component>.</danger>'
          either: '<danger>''<input>'' is neither <primary> nor <fallback>.</danger>'
    exception:
      unexpected: '<danger>Something went wrong while running this command.</danger>'
      invalid_argument: '<cause>'
      no_such_command: '<danger>Unknown command.</danger>'
      no_permission: '<danger>You don''t have permission to do that.</danger>'
      invalid_sender: '<danger>Only <expected> can use this command.</danger>'
      invalid_sender_list: '<danger>Only <expected> can use this command.</danger>'
      invalid_syntax: '<danger>Usage: <syntax></danger>'
    sakurabans:
      target: '<danger>''<input>'' is not a player, UUID, address or #id.</danger>'
      duration: '<danger>''<input>'' is not a duration (like 30m, 7d or 1mo).</danger>'
      scope: '<danger>''<input>'' is not a scope (global, local, server:<name> or category:<name>; all only when lifting punishments).</danger>'
  description:
    sakurabans: 'SakuraBans help'
    ban: 'Ban a player or address'
    tempban: 'Ban for a while'
    ipban: 'Ban a player together with their address'
    mute: 'Mute a player or address'
    tempmute: 'Mute for a while'
    ipmute: 'Mute a player together with their address'
    warn: 'Warn a player'
    kick: 'Kick a player'
    punish: 'Apply the next step of a ladder'
    unban: 'Lift a ban'
    pardon: 'Lift a ban (same as unban)'
    allow: 'Accounts and addresses that address bans don''t reach'
    templates: 'Punishment templates'
    settings: 'Settings overridden in the database'
    messages: 'Messages overridden in the database'
    editor: 'Edit settings, messages and templates in the web editor'
    applyedits: 'Apply the changes saved in the web editor'
    unlink: 'Forget addresses of an account'
    unmute: 'Lift a mute'
    unwarn: 'Remove a warning'
    checkban: 'Show active bans'
    checkmute: 'Show active mutes'
    checkwarn: 'Show active warnings'
    history: 'A player''s punishment history'
    staffhistory: 'The punishments a staff member issued'
    warns: 'Active warnings'
    banlist: 'Active bans'
    mutelist: 'Active mutes'
    warnlist: 'Active warnings of everyone'
    alts: 'Accounts that share an address'
    iphistory: 'Addresses a player joined from'
    namehistory: 'Names a player used'
    lastuuid: 'The last account that used a name'
    ipreport: 'Online players who share an address'
    geoip: 'The country of a player or address'
    info: 'Show a punishment'
