# SakuraBans messages, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
#
# SakuraBans never rewrites this file. Keys missing here fall back to the built-in English text,
# and are listed in the log at startup. To translate, copy this file to lang/<locale>.yml (for
# example de_DE.yml); missing keys there fall back to en_US.
#
# <prefix> inserts the prefix below into any message. Values that come from players or staff
# (names, reasons) are always shown as plain text.

prefix: '<#f4a7b9>SakuraBans</#f4a7b9> <dark_gray>»</dark_gray> '

error:
  internal: '<prefix><red>Something went wrong. Please tell an administrator (incident <id>).</red>'
  not_ready: '<prefix><red>SakuraBans is still starting. Try again in a moment.</red>'
  no_permission: '<prefix><red>You don''t have permission to do that.</red>'

operator:
  console: Console

type:
  ban: ban
  mute: mute
  warn: warning
  kick: kick

scope:
  global: everywhere
  server: 'server <name>'
  category: 'category <name>'

time:
  permanent: permanent
  never: never
  separator: ', '
  last_separator: ' and '
  second: '<count> second'
  seconds: '<count> seconds'
  minute: '<count> minute'
  minutes: '<count> minutes'
  hour: '<count> hour'
  hours: '<count> hours'
  day: '<count> day'
  days: '<count> days'
  year: '<count> year'
  years: '<count> years'

# Disconnect screens. Placeholders: <reason> <operator> <duration> <remaining> <expires> <id>
# <display_id> <scope> <type> <kind> <server>.
screen:
  ban: |-
    <red><bold>You are banned.</bold></red>

    <gray>Reason:</gray> <white><reason></white>
    <gray>Banned by:</gray> <white><operator></white>

    <dark_gray>Punishment <display_id></dark_gray>
  ban_temporary: |-
    <red><bold>You are banned.</bold></red>

    <gray>Reason:</gray> <white><reason></white>
    <gray>Banned by:</gray> <white><operator></white>
    <gray>Ends in:</gray> <white><remaining></white>

    <dark_gray>Punishment <display_id></dark_gray>
  kick: |-
    <red><bold>You were kicked.</bold></red>

    <gray>Reason:</gray> <white><reason></white>
  check_failed: |-
    <red><bold>We couldn't check your account.</bold></red>

    <gray>Please try again in a moment.</gray>
  lockdown: |-
    <red><bold>This server is locked down.</bold></red>

    <gray>Reason:</gray> <white><reason></white>

    <gray>Please try again later.</gray>

# Sent to the punished player.
victim:
  # How a punishment names an address removed by /sb gdpr erase.
  erased_address: erased address
  muted: '<prefix><red>You were muted by <operator>: <reason></red>'
  muted_temporary: '<prefix><red>You were muted by <operator> for <duration>: <reason></red>'
  warned: '<prefix><red>You were warned by <operator>: <reason></red>'
  warned_away: '<prefix><red>While you were away, <operator> warned you (<created>): <reason></red>'

# When a muted player chats or runs a blocked command.
chat:
  muted: '<prefix><red>You are muted: <reason></red>'
  muted_temporary: '<prefix><red>You are muted for <remaining>: <reason></red>'
  command_muted: '<prefix><red>You can''t use this command while you are muted.</red>'
  loading: '<prefix><gray>Your chat is still being checked. Try again in a moment.</gray>'

# Staff notices. <silent> is the silent tag below for silent punishments, else empty.
notify:
  silent_tag: '<gray>[Silent]</gray> '
  ban: '<prefix><silent><white><operator></white> <red>banned</red> <white><victim></white> <gray>(<duration>, <scope>):</gray> <reason>'
  mute: '<prefix><silent><white><operator></white> <red>muted</red> <white><victim></white> <gray>(<duration>, <scope>):</gray> <reason>'
  warn: '<prefix><silent><white><operator></white> <yellow>warned</yellow> <white><victim></white><gray>:</gray> <reason>'
  kick: '<prefix><silent><white><operator></white> <yellow>kicked</yellow> <white><victim></white><gray>:</gray> <reason>'
  unban: '<prefix><silent><white><revoker></white> <green>unbanned</green> <white><victim></white>'
  unmute: '<prefix><silent><white><revoker></white> <green>unmuted</green> <white><victim></white>'
  unwarn: '<prefix><silent><white><revoker></white> <green>removed a warning of</green> <white><victim></white>'
  attempt_join: '<prefix><gray><name> tried to join but is banned (<duration>, by <operator>):</gray> <reason>'
  attempt_chat: '<prefix><gray><name> tried to chat but is muted:</gray> <message>'
  alts:
    join: '<prefix><white><name></white> <gray>joined with <count> known alts:</gray> <alts>'
    name: '<white><name></white>'
    punished_name: '<red><name></red>'

# Commands. Captions (command.caption.*) are the errors of the command framework; their
# placeholders are the framework's variables.
command:
  caption:
    argument:
      parse:
        failure:
          boolean: '<red>''<input>'' is not true or false.</red>'
          number: '<red>''<input>'' is not a number from <min> to <max>.</red>'
          char: '<red>''<input>'' is not a single character.</red>'
          string: '<red>''<input>'' is not valid text here.</red>'
          uuid: '<red>''<input>'' is not a UUID.</red>'
          enum: '<red>''<input>'' is not one of <acceptableValues>.</red>'
          regex: '<red>''<input>'' doesn''t match <pattern>.</red>'
          flag:
            unknown: '<red>Unknown flag <flag>.</red>'
            duplicate_flag: '<red>The flag <flag> is given twice.</red>'
            no_flag_started: '<red>''<input>'' isn''t a flag. Flags start with - or --.</red>'
            missing_argument: '<red>The flag <flag> needs a value.</red>'
            no_permission: '<red>You can''t use the flag <flag>.</red>'
          color: '<red>''<input>'' is not a color.</red>'
          duration: '<red>''<input>'' is not a duration (like 30m, 7d or 1mo).</red>'
          aggregate:
            missing: '<red>Missing <component>.</red>'
          either: '<red>''<input>'' is neither <primary> nor <fallback>.</red>'
    exception:
      unexpected: '<red>Something went wrong while running this command.</red>'
      invalid_argument: '<cause>'
      no_such_command: '<red>Unknown command.</red>'
      no_permission: '<red>You don''t have permission to do that.</red>'
      invalid_sender: '<red>Only <expected> can use this command.</red>'
      invalid_sender_list: '<red>Only <expected> can use this command.</red>'
      invalid_syntax: '<red>Usage: <syntax></red>'
    sakurabans:
      target: '<red>''<input>'' is not a player, UUID, address or #id.</red>'
      duration: '<red>''<input>'' is not a duration (like 30m, 7d or 1mo).</red>'
      scope: '<red>''<input>'' is not a scope (global, local, server:<name> or category:<name>; all only when lifting punishments).</red>'
  description:
    sakurabans: 'SakuraBans help'
    ban: 'Ban a player or address'
    tempban: 'Ban for a while'
    ipban: 'Ban a player together with their address'
    mute: 'Mute a player or address'
    tempmute: 'Mute for a while'
    ipmute: 'Mute a player together with their address'
    warn: 'Warn a player'
    kick: 'Kick a player'
    unban: 'Lift a ban'
    pardon: 'Lift a ban (same as unban)'
    allow: 'Accounts and addresses that address bans don''t reach'
    templates: 'Punishment templates'
    kinds: 'Punishment kinds'
    kind: 'Punish with the kind <kind>'
    unlink: 'Forget addresses of an account'
    unmute: 'Lift a mute'
    unwarn: 'Remove a warning'
    checkban: 'Show active bans'
    checkmute: 'Show active mutes'
    checkwarn: 'Show active warnings'
    history: 'A player''s punishment history'
    staffhistory: 'The punishments a staff member issued'
    warns: 'Active warnings'
    banlist: 'Active bans'
    mutelist: 'Active mutes'
    warnlist: 'Active warnings of everyone'
    alts: 'Accounts that share an address'
    iphistory: 'Addresses a player joined from'
    namehistory: 'Names a player used'
    lastuuid: 'The last account that used a name'
    ipreport: 'Online players who share an address'
    info: 'Show a punishment'
    edit: 'Change a punishment'
    delete: 'Delete a punishment from the history'
    evidence: 'Attach or detach evidence'
    lockdown: 'Keep new players out'
    staffrollback: 'Lift what a staff member issued recently'
    prunehistory: 'Delete a player''s ended punishments'
    status: 'SakuraBans status'
    reload: 'Reload the configuration and messages'
    gdpr: 'Export or erase a player''s data'
    import: 'Import punishments from another plugin or database'
  invalid: '<prefix><red>That doesn''t work: <details></red>'
  unknown_target: '<prefix><red>Nobody is known as <input>.</red>'
  id_not_allowed: '<prefix><red>Name a player or an address here, not a punishment id.</red>'
  range_no_permission: '<prefix><red>You can''t punish address ranges.</red>'
  no_address: '<prefix><red>No address is known for <name>.</red>'
  address_no_permission: '<prefix><red>You can''t punish addresses.</red>'
  scope_no_permission: '<prefix><red>You can''t punish in <scope>.</red>'
  scope_default_no_permission: '<prefix><red>Name a scope: --global, --server, --category or --scope.</red>'
  sender_needs_name: '<prefix><red>--sender-uuid needs --sender with a name.</red>'
  players_only: '<prefix><red>Only players can use this without naming someone.</red>'
  player_required: '<prefix><red><input> is not a player.</red>'
  not_an_id: '<prefix><red>''<input>'' is not a punishment id (like 12 or K7Q2M9XA).</red>'
punish:
  ban: '<prefix><green>Banned <white><victim></white> (<duration>, <scope>): <white><reason></white> <gray>#<display_id></gray></green>'
  mute: '<prefix><green>Muted <white><victim></white> (<duration>, <scope>): <white><reason></white> <gray>#<display_id></gray></green>'
  warn: '<prefix><green>Warned <white><victim></white>: <white><reason></white> <gray>#<display_id></gray></green>'
  kick: '<prefix><green>Kicked <white><victim></white>: <white><reason></white></green>'
  failure:
    already_punished: '<prefix><red><victim> already has an active <type> in <scope> (#<display_id>, <duration>). Use -o to replace it.</red>'
    already_punished_generic: '<prefix><red>The victim already has an active punishment of that type there. Use -o to replace it.</red>'
    exempt: '<prefix><red>That player can''t be punished by you.</red>'
    cancelled: '<prefix><red>Another plugin cancelled this punishment.</red>'
    limit_exceeded: '<prefix><red>That is longer than your limit allows.</red>'
    cooldown: '<prefix><red>Wait a moment before punishing again.</red>'
    reason_required: '<prefix><red>Give a reason.</red>'
    template_required: '<prefix><red>Use a template (--template).</red>'
    unknown_template: '<prefix><red>There is no such template.</red>'
    no_template: '<prefix><red>There is no template or reason shortcut called <name>.</red>'
    template_no_permission: '<prefix><red>You can''t use the template <name>.</red>'
    template_type: '<prefix><red><name> is a <type> template.</red>'
    unknown_kind: '<prefix><red>There is no such punishment kind.</red>'
    evidence_required: '<prefix><red>This punishment needs evidence. Attach it with --evidence <namespace>:<type>:<id>.</red>'
    forbidden: '<prefix><red>You may not do that.</red>'
revoke:
  ban: '<prefix><green>Unbanned <white><target></white> (<count>).</green>'
  mute: '<prefix><green>Unmuted <white><target></white> (<count>).</green>'
  warn: '<prefix><green>Removed a warning of <white><target></white>.</green>'
  failure:
    not_found: '<prefix><red>No active punishment was found.</red>'
    not_own: '<prefix><red>You can only lift punishments you issued.</red>'
    exempt: '<prefix><red>You can''t lift that punishment.</red>'
    cancelled: '<prefix><red>Another plugin cancelled this.</red>'
    reason_required: '<prefix><red>Give a reason.</red>'
    forbidden: '<prefix><red>You may not do that.</red>'
    wrong_type: '<prefix><red>#<display_id> is a <type>.</red>'
    scope_no_permission: '<prefix><red>You can''t lift punishments in <scopes>.</red>'
  skipped_scopes: '<prefix><yellow>Not lifted in <scopes>, which you can''t use.</yellow>'
check:
  none: '<prefix><gray><name> has nothing active.</gray>'
  header: '<prefix><white><name></white><gray>: <total> active (page <page>/<pages>)</gray>'
  detail: |-
    <prefix><white>#<display_id></white> <type> of <white><victim></white> by <operator>, <created>
    <gray>Reason:</gray> <reason>
    <gray>Scope:</gray> <scope> <gray>Length:</gray> <duration> <gray>Expires:</gray> <expires>
history:
  header: '<prefix><gray>History of</gray> <white><name></white> <gray>(<total>, page <page>/<pages>)</gray>'
staffhistory:
  header: '<prefix><gray>Issued by</gray> <white><name></white> <gray>(<total>, page <page>/<pages>)</gray>'
warns:
  header: '<prefix><gray>Warnings of</gray> <white><name></white> <gray>(<total>, page <page>/<pages>)</gray>'
list:
  header:
    banlist: '<prefix><gray>Active bans (<total>, page <page>/<pages>)</gray>'
    mutelist: '<prefix><gray>Active mutes (<total>, page <page>/<pages>)</gray>'
    warnlist: '<prefix><gray>Active warnings (<total>, page <page>/<pages>)</gray>'
  entry: '<dark_gray>#<display_id></dark_gray> <status> <white><type></white> <victim> <gray>by</gray> <operator> <gray>(<duration>, <created>):</gray> <reason>'
  empty: '<prefix><gray>Nothing to show.</gray>'
  no_such_page: '<prefix><red>There are only <pages> pages.</red>'
  footer: '<gray><previous> Page <page> of <pages> <next></gray>'
  previous: '<white>[«]</white>'
  next: '<white>[»]</white>'
  arrow_disabled: '<dark_gray>[ ]</dark_gray>'
  status:
    active: '<red>●</red>'
    expired: '<gray>○</gray>'
    ended: '<green>○</green>'
    instant: '<yellow>●</yellow>'
alts:
  none: '<prefix><gray>No alts are known for <name>.</gray>'
  header: '<prefix><white><name></white><gray> has <count> known alts (<strictness>):</gray>'
  entry: '<gray> - </gray><white><name></white> <gray>(last seen <last_seen>; via <addresses>)</gray><punished>'
  punished: ' <red>[<types>]</red>'
iphistory:
  none: '<prefix><gray>No addresses are known for <name>.</gray>'
  header: '<prefix><gray>Addresses of</gray> <white><name></white><gray>:</gray>'
  entry: '<gray> - </gray><white><address></white> <gray>(<first_seen> to <last_seen>, <server>)</gray>'
namehistory:
  none: '<prefix><gray>No names are known for <name>.</gray>'
  header: '<prefix><gray>Names of</gray> <white><name></white><gray>:</gray>'
  entry: '<gray> - </gray><white><name></white> <gray>(<first_seen> to <last_seen>)</gray>'
lastuuid:
  result: '<prefix><white><name></white><gray> was last used by</gray> <white><uuid></white>'
  none: '<prefix><gray>Nobody has used the name <name> here.</gray>'
allow:
  added: '<prefix><green>Allow-listed <white><target></white>: address punishments no longer reach it.</green>'
  already: '<prefix><yellow><target> is already allow-listed.</yellow>'
  removed: '<prefix><green>Removed <white><target></white> from the allow list.</green>'
  not_listed: '<prefix><yellow><target> isn''t allow-listed.</yellow>'
  target: '<prefix><red>Name a player or an address.</red>'
  list:
    empty: '<prefix><gray>The allow list is empty.</gray>'
    header: '<prefix><white>Allow list</white> <gray>(<count>)</gray>'
    entry: '<gray>-</gray> <white><target></white> <gray>by <operator>, <added>: <note></gray>'
unlink:
  done: '<prefix><green>Forgot <count> address(es) of <white><name></white>.</green>'
  none: '<prefix><yellow>No such address is recorded for <name>.</yellow>'
  not_address: '<prefix><red>''<input>'' is not an address.</red>'
ipreport:
  none: '<prefix><gray>No two online players share an address.</gray>'
  header: '<prefix><gray>Online players sharing an address (<count>):</gray>'
  entry: '<gray> - </gray><white><address></white><gray>:</gray> <names>'
templates:
  list:
    empty: '<prefix><gray>There are no templates.</gray>'
    header: '<prefix><white>Templates</white> <gray>(<count>)</gray>'
    entry: '<gray> - </gray><white><name></white> <gray><kind>:</gray> <ladder><gray>; <reason></gray>'
  import:
    confirm: '<prefix><yellow>This creates or updates the templates in templates.yml (<count>) for every server. Run it again with --confirm within 30 seconds.</yellow>'
    done: '<prefix><green>Templates imported: <created> new, <updated> updated, <unchanged> unchanged.</green>'
    error: '<prefix><red><error></red>'
  export:
    done: '<prefix><green>Exported <count> templates to <file>.</green>'
kinds:
  list:
    header: '<prefix><white>Kinds</white> <gray>(<count>)</gray>'
    entry: '<gray> - </gray><white><id></white> <gray>(<name>): <type><modifiers></gray>'
edit:
  done: '<prefix><green>Changed #<display_id>: <white><what></white>.</green>'
  permanent: '<prefix><red>#<display_id> is permanent; set a duration instead.</red>'
  failure:
    not_found: '<prefix><red>There is no such punishment.</red>'
    not_active: '<prefix><red>That punishment isn''t active any more.</red>'
    invalid_expiry: '<prefix><red>That would end it before now.</red>'
    already_punished: '<prefix><red>The victim already has an active <type> there.</red>'
    exempt: '<prefix><red>You can''t change that punishment.</red>'
    cancelled: '<prefix><red>Another plugin cancelled this.</red>'
    conflict: '<prefix><red>Someone else changed it meanwhile; try again.</red>'
    evidence_already_attached: '<prefix><yellow>That evidence is already attached.</yellow>'
    evidence_not_attached: '<prefix><yellow>That evidence isn''t attached.</yellow>'
    forbidden: '<prefix><red>You may not do that.</red>'
    already_voided: '<prefix><yellow>That punishment is already voided.</yellow>'
  what:
    reason: 'reason'
    expiry: 'now <expires>'
    scope: 'now <scope>'
    evidence_added: 'evidence added'
    evidence_removed: 'evidence removed'
void:
  done: '<prefix><green>Voided #<display_id> (<type> of <white><victim></white>).</green>'
delete:
  confirm: '<prefix><yellow>This deletes #<display_id> (<type> of <victim>) for good. Run it again with --confirm within 30 seconds.</yellow>'
  done: '<prefix><green>Deleted #<display_id> (<type> of <white><victim></white>).</green>'
info:
  evidence: '<gray>Evidence:</gray> <white><uri></white> <dark_gray>(<added_by>, <added>)</dark_gray>'
  ended: '<gray>Ended:</gray> <end> <dark_gray>(<at>, <revoker>)</dark_gray> <revoke_reason>'
  voided: '<red>Voided</red> <dark_gray>(<at>, <actor>)</dark_gray> <reason>'
  audit:
    header: '<gray>Changes:</gray>'
    entry: '<dark_gray><at></dark_gray> <white><action></white> <gray>by <actor> (<source>)</gray> <old><new>'
lockdown:
  started: '<prefix><green>Locked down <white><scope></white> (ends: <ends>): nobody new may join unless they have sakurabans.lockdown.bypass.</green>'
  ended: '<prefix><green>Ended the lockdown of <white><scope></white>.</green>'
  not_found: '<prefix><yellow><scope> isn''t locked down.</yellow>'
  status:
    none: '<prefix><gray>Nothing is locked down.</gray>'
    header: '<prefix><white>Lockdowns</white> <gray>(<count>)</gray>'
    entry: '<gray> - </gray><white><scope></white> <gray>by <actor>, <since>, until <ends>:</gray> <reason>'
rollback:
  confirm: '<prefix><yellow>This lifts <count> active punishments <name> issued since <since>. Run it again with --confirm within 30 seconds.</yellow>'
  done: '<prefix><green>Lifted <count> punishments issued by <white><name></white>.</green>'
  none: '<prefix><gray><name> issued nothing that is still active since <since>.</gray>'
  failure:
    reason_required: '<prefix><red>Give a reason.</red>'
    forbidden: '<prefix><red>You may not do that.</red>'
prune:
  confirm: '<prefix><yellow>This deletes <count> ended punishments of <name> for good. Run it again with --confirm within 30 seconds.</yellow>'
  done: '<prefix><green>Deleted <count> of <total> ended punishments of <white><name></white>.</green>'
  none: '<prefix><gray><name> has no ended punishments to delete.</gray>'
status:
  body: |-
    <prefix><white>SakuraBans <version></white> <gray>(<commit>)</gray>
    <gray>Platform:</gray> <white><platform></white>
    <gray>Server:</gray> <white><server></white>
    <gray>Storage:</gray> <white><storage></white> <gray>Sync:</gray> <white><sync></white>
    <gray>Active punishments:</gray> <white><active></white> <gray>Lockdowns:</gray> <white><lockdowns></white>
reload:
  done: '<prefix><green>Reloaded the configuration and messages.</green>'
  restart: '<prefix><yellow>Changes in <files> need a restart.</yellow>'
  error: '<prefix><red><error></red>'
  failed: '<prefix><red>The configuration has errors; the old settings stay active.</red>'
gdpr:
  exported: '<prefix><green>Exported the data of <white><name></white> to <file>: <received> punishments received, <issued> issued.</green>'
  erase:
    confirm: '<prefix><yellow>This erases the names and addresses SakuraBans knows of <name> (<uuid>). Punishments stay in force; banned addresses are kept only as hashes. It can''t be undone. Run it again with --confirm within 30 seconds.</yellow>'
  erased: '<prefix><green>Erased <white><name></white>: <names> names, <addresses> addresses and <allowed> allow-list addresses removed, <cleared> punished addresses reduced to hashes, <evidence> evidence links removed, <redacted> staff name records redacted. <kept> punishments kept.</green>'
  failure:
    forbidden: '<prefix><red>You may not do that.</red>'
import:
  unknown_source: '<prefix><red>There is no import source <source>. Use one of: <sources>.</red>'
  confirm: '<prefix><yellow>The import from <source> reads <rows>. Run it again with --confirm within 30 seconds to import, or with --dry-run to only check it.</yellow>'
  started: '<prefix><gray>Importing from <source>; the report follows when it is done, progress is logged in the console.</gray>'
  started_dry_run: '<prefix><gray>Checking what an import from <source> would do; nothing is stored. The report follows when it is done.</gray>'
  busy: '<prefix><red>An import is already running on the network; try again when it is done.</red>'
  not_configured: '<prefix><red>Set <details>.jdbc-url in import.yml first.</red>'
  config_invalid: '<prefix><red>import.yml has errors: <details></red>'
  unreachable: '<prefix><red>Can''t open the <source> database: <details></red>'
  unreadable: '<prefix><red>Can''t read from <source>: <details></red>'
  not_sakurabans: '<prefix><red>That database has no SakuraBans tables with the prefix "<details>".</red>'
  other_version: '<prefix><red>That SakuraBans database has schema version <details>; update both servers to the same SakuraBans version first.</red>'
  target_not_empty: '<prefix><red>This database already holds data (<details>); a self import only goes into an empty one.</red>'
  failed: '<prefix><red>The import from <source> stopped: <details>. What it stored so far stays; running it again goes on where it stopped.</red>'
  report:
    done: '<prefix><green>Import from <source> done: <imported> punishments imported, <skipped> already there, <failed> failed, <players> players merged, <superseded> superseded, <truncated> texts shortened.</green>'
    dry_run: '<prefix><yellow>Dry run of <source>: <imported> punishments would be imported, <skipped> are already there, <failed> fail, <players> players read. Nothing was stored.</yellow>'
    tables: '<prefix><gray>Rows: <tables></gray>'
    failure: '<prefix><gray>Not imported: <id>: <errors></gray>'
